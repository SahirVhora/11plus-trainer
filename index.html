<script>
"use strict";
/* ================= utilities ================= */
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniqPush=(arr,v,eq)=>{if(!arr.some(x=>eq?eq(x,v):x===v))arr.push(v);return arr;};
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const store={
  get(k,d){try{const v=localStorage.getItem("t11_"+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("t11_"+k,JSON.stringify(v));}catch(e){}}
};
function recordStat(subject,topic,correct){
  const s=store.get("stats",{});
  const key=subject+"|"+topic;
  s[key]=s[key]||{c:0,t:0};
  s[key].t++; if(correct)s[key].c++;
  store.set("stats",s);
}
/* ================= SVG shape library ================= */
const SVG_DEFS=`<defs>
<pattern id="pdots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.7" fill="#334"/></pattern>
<pattern id="phatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#334" stroke-width="1.6"/></pattern>
</defs>`;
const FILLS={none:"#ffffff",black:"#2b2f4a",grey:"#b8bcd6",dots:"url(#pdots)",hatch:"url(#phatch)"};
function ngonPts(n,r,rot=-90){
  const pts=[];
  for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;pts.push((50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1));}
  return pts.join(" ");
}
function starPts(points,rOut,rIn){
  const pts=[];
  for(let i=0;i<points*2;i++){const r=i%2===0?rOut:rIn;const a=(-90+i*180/points)*Math.PI/180;pts.push((50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1));}
  return pts.join(" ");
}
/* kind: circle square triangle pentagon hexagon star diamond arrow flag ; size: 0.6-1 ; fill key ; rot deg */
function shapeSVG(s){
  const sz=s.size||1, fill=FILLS[s.fill||"none"], rot=s.rot||0, sw=3;
  let el="";
  const r=36*sz;
  switch(s.kind){
    case "circle": el=`<circle cx="50" cy="50" r="${r}" />`;break;
    case "square": el=`<rect x="${50-r*0.9}" y="${50-r*0.9}" width="${r*1.8}" height="${r*1.8}" />`;break;
    case "diamond": el=`<polygon points="${ngonPts(4,r)}" />`;break;
    case "triangle": el=`<polygon points="${ngonPts(3,r)}" />`;break;
    case "pentagon": el=`<polygon points="${ngonPts(5,r)}" />`;break;
    case "hexagon": el=`<polygon points="${ngonPts(6,r)}" />`;break;
    case "star": el=`<polygon points="${starPts(5,r,r*0.45)}" />`;break;
    case "arrow": el=`<polygon points="50,${50-r} ${50+r*0.62},${50+r*0.15} ${50+r*0.25},${50+r*0.15} ${50+r*0.25},${50+r} ${50-r*0.25},${50+r} ${50-r*0.25},${50+r*0.15} ${50-r*0.62},${50+r*0.15}" />`;break;
    case "flag": el=`<polygon points="${50-r*0.5},${50-r} ${50+r*0.7},${50-r*0.55} ${50-r*0.1},${50-r*0.15} ${50-r*0.1},${50+r} ${50-r*0.5},${50+r}" />`;break;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${SVG_DEFS}<g transform="rotate(${rot},50,50)" fill="${fill}" stroke="#2b2f4a" stroke-width="${sw}" stroke-linejoin="round">${el}</g></svg>`;
}
const shapeEq=(a,b)=>a.kind===b.kind&&(a.fill||"none")===(b.fill||"none")&&Math.round(((a.rot||0)%360+360)%360)===Math.round(((b.rot||0)%360+360)%360)&&Math.abs((a.size||1)-(b.size||1))<0.05;
const SHAPES=["circle","square","triangle","pentagon","hexagon","star","diamond"];
const ASYM=["arrow","flag"];
const FILLKEYS=["none","black","grey","dots","hatch"];
/* ================= NVR generators ================= */
function optionsFrom(answer,makeDistractor){
  const opts=[answer];
  let guard=0;
  while(opts.length<5&&guard++<60){uniqPush(opts,makeDistractor(),shapeEq);}
  const shuffled=shuffle(opts);
  return {opts:shuffled,answerIdx:shuffled.findIndex(o=>shapeEq(o,answer))};
}
function nvrSeries(){
  const mode=pick(["rot","size","shade","shape"]);
  const base={kind:pick(SHAPES.concat(ASYM)),fill:pick(FILLKEYS),size:0.9,rot:0};
  let cells=[],answer,expl;
  if(mode==="rot"){
    const k=pick(ASYM), step=pick([45,90]);
    for(let i=0;i<4;i++)cells.push({kind:k,fill:base.fill,size:0.9,rot:i*step});
    answer={kind:k,fill:base.fill,size:0.9,rot:4*step};
    expl=`The shape rotates ${step}° clockwise each time, so the next turn gives the answer.`;
  }else if(mode==="size"){
    const sizes=[0.55,0.7,0.85,1.0,1.15],dir=pick([1,-1]);
    const seq=dir===1?sizes:sizes.slice().reverse();
    for(let i=0;i<4;i++)cells.push({kind:base.kind,fill:base.fill,size:seq[i]});
    answer={kind:base.kind,fill:base.fill,size:seq[4]};
    expl=`The shape gets steadily ${dir===1?"bigger":"smaller"} each time.`;
  }else if(mode==="shade"){
    const cyc=shuffle(FILLKEYS).slice(0,3);
    for(let i=0;i<4;i++)cells.push({kind:base.kind,fill:cyc[i%3],size:0.9});
    answer={kind:base.kind,fill:cyc[4%3],size:0.9};
    expl=`The shading repeats in a cycle of three; the fifth shape matches the second.`;
  }else{
    const order=shuffle(SHAPES).slice(0,3);
    for(let i=0;i<4;i++)cells.push({kind:order[i%3],fill:base.fill,size:0.9});
    answer={kind:order[4%3],fill:base.fill,size:0.9};
    expl=`The shapes repeat in a cycle of three (${order.join(", ")}).`;
  }
  const {opts,answerIdx}=optionsFrom(answer,()=>{
    const d={...answer};
    const t=ri(1,3);
    if(t===1)d.rot=(answer.rot||0)+pick([45,90,180]);
    else if(t===2)d.fill=pick(FILLKEYS);
    else d.kind=pick(SHAPES.concat(ASYM));
    return d;
  });
  return {type:"series",topic:"shape-series",cells,opts,answerIdx,expl,prompt:"Which shape comes next in the series?"};
}
function nvrMatrix(){
  const mode=pick(["fillCols","rotCols","sizeCols"]);
  /* for rotation columns, only use shapes that look different when rotated 90° */
  const rows=mode==="rotCols"?shuffle(["arrow","flag","triangle"]):shuffle(SHAPES).slice(0,3);
  const fills=shuffle(FILLKEYS).slice(0,3);
  const grid=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const cell={kind:rows[r],fill:mode==="fillCols"?fills[c]:fills[r],size:mode==="sizeCols"?[0.6,0.85,1.1][c]:0.9,rot:mode==="rotCols"?c*90:0};
    grid.push(cell);
  }
  const answer=grid[8];
  const {opts,answerIdx}=optionsFrom(answer,()=>{
    const d={...answer};const t=ri(1,4);
    if(t===1)d.kind=pick(SHAPES);
    else if(t===2)d.fill=pick(FILLKEYS);
    else if(t===3)d.rot=(answer.rot||0)+90;
    else d.size=(answer.size||0.9)>0.8?0.6:1.1;
    return d;
  });
  const explMap={fillCols:"Each row keeps the same shape and each column keeps the same shading.",rotCols:"Each row keeps the same shape; across each row the shape rotates 90° per column.",sizeCols:"Each row keeps the same shape; across each row the shape grows per column."};
  return {type:"matrix",topic:"matrix-patterns",grid:grid.slice(0,8),opts,answerIdx,expl:explMap[mode],prompt:"Which shape completes the grid?"};
}
function nvrRotation(){
  const kind=pick(ASYM), fill=pick(FILLKEYS);
  const baseRot=ri(0,3)*90;
  const target={kind,fill,size:0.9,rot:baseRot};
  const rotBy=pick([90,180,270]);
  const answer={kind,fill,size:0.9,rot:baseRot+rotBy};
  const {opts,answerIdx}=optionsFrom(answer,()=>{
    const d={...answer};const t=ri(1,3);
    if(t===1){d.rot=baseRot+pick([90,180,270]);}
    else if(t===2){d.kind=kind;d.fill=pick(FILLKEYS.filter(f=>f!==fill));}
    else {d.rot=baseRot;}
    return d;
  });
  return {type:"single",topic:"rotations",cells:[target],opts,answerIdx,expl:`The answer is the same shape turned ${rotBy}° clockwise - same shading, nothing flipped.`,prompt:`Which option shows this shape rotated ${rotBy}°?`};
}
function nvrOddOneOut(){
  const mode=pick(["fill","kind","size"]);
  let items=[];
  if(mode==="fill"){
    const f=pick(FILLKEYS), other=pick(FILLKEYS.filter(x=>x!==f));
    const kinds=shuffle(SHAPES).slice(0,5);
    items=kinds.map(k=>({kind:k,fill:f,size:0.9}));
    items[ri(0,4)].fill=other;
  }else if(mode==="kind"){
    const sided=[["triangle",3],["square",4],["diamond",4],["pentagon",5],["hexagon",6]];
    const four=sided.filter(s=>s[1]===4);
    const others=shuffle(sided.filter(s=>s[1]!==4)).slice(0,1);
    const f=pick(FILLKEYS);
    items=[{kind:"square",fill:f,size:0.9},{kind:"diamond",fill:f,size:0.9},{kind:"square",fill:f,size:0.7,rot:20},{kind:"diamond",fill:f,size:1.05,rot:15},{kind:others[0][0],fill:f,size:0.9}];
    items=shuffle(items);
  }else{
    const k=pick(SHAPES), f=pick(FILLKEYS);
    items=[0,1,2,3,4].map(()=>({kind:k,fill:f,size:0.85}));
    items[ri(0,4)].size=1.2;
  }
  let oddIdx;
  if(mode==="fill"){const counts={};items.forEach(i=>counts[i.fill]=(counts[i.fill]||0)+1);oddIdx=items.findIndex(i=>counts[i.fill]===1);}
  else if(mode==="kind"){oddIdx=items.findIndex(i=>i.kind!=="square"&&i.kind!=="diamond");}
  else{oddIdx=items.findIndex(i=>i.size>1);}
  const explMap={fill:"Four shapes share the same shading; one is shaded differently.",kind:"Four shapes are four-sided; one has a different number of sides.",size:"Four shapes are the same size; one is larger."};
  return {type:"odd",topic:"odd-shape-out",opts:items,answerIdx:oddIdx,expl:explMap[mode],prompt:"Which shape is the odd one out?"};
}
function nvrReflection(){
  /* only the flag is asymmetric under a vertical mirror at every rotation */
  const kind="flag", fill=pick(FILLKEYS), rot=pick([0,90,180,270]);
  const target={kind,fill,size:0.9,rot};
  /* reflection rendered via scale(-1,1) flag */
  const answer={kind,fill,size:0.9,rot,flip:true};
  const opts=[answer,{kind,fill,size:0.9,rot:rot+180},{kind,fill,size:0.9,rot},{kind,fill:pick(FILLKEYS.filter(f=>f!==fill)),size:0.9,rot,flip:true},{kind,fill,size:0.9,rot:rot+90}];
  const shuffled=shuffle(opts);
  return {type:"single",topic:"reflections",cells:[target],opts:shuffled,answerIdx:shuffled.indexOf(answer),expl:"A mirror image flips left-to-right. A 180° rotation is NOT the same as a reflection - that is the classic trap.",prompt:"Which option shows this shape reflected in a vertical mirror?"};
}
function shapeRender(s){
  if(s.flip){
    return shapeSVG({...s}).replace('<g transform="','<g transform="translate(100,0) scale(-1,1) ');
  }
  return shapeSVG(s);
}
const NVR_GENS=[nvrSeries,nvrMatrix,nvrRotation,nvrOddOneOut,nvrReflection];
/* ================= Maths generators ================= */
function mkNumOpts(ans,fmt){
  fmt=fmt||(x=>String(x));
  const set=[ans];let guard=0;
  while(set.length<4&&guard++<50){
    const d=ans+pick([-1,1])*pick([1,2,ri(3,10),Math.max(1,Math.round(Math.abs(ans)*0.1))]);
    if(!set.includes(d)&&d>=0)set.push(d);
  }
  const opts=shuffle(set);
  return {texts:opts.map(fmt),answerIdx:opts.indexOf(ans)};
}
function formatClock(totalMinutes){
  const mins=((totalMinutes%1440)+1440)%1440;
  const hour24=Math.floor(mins/60), minute=mins%60;
  const suffix=hour24<12?"am":"pm";
  const hour12=hour24%12||12;
  return `${hour12}:${String(minute).padStart(2,"0")} ${suffix}`;
}
const MATH_GENS=[
  function(){const a=ri(120,980),b=ri(120,980);const ans=a+b;const o=mkNumOpts(ans);return {topic:"arithmetic",q:`${a} + ${b} = ?`,...o,expl:`Add the units, tens and hundreds columns: ${a} + ${b} = ${ans}.`};},
  function(){const a=ri(500,999),b=ri(100,499);const ans=a-b;const o=mkNumOpts(ans);return {topic:"arithmetic",q:`${a} − ${b} = ?`,...o,expl:`${a} − ${b} = ${ans}. Check by adding back: ${ans} + ${b} = ${a}.`};},

/* ================= Spaced repetition (Leitner) ================= */
const SR_INTERVALS=[0,1,3,7,16,30]; /* days per box */
function today(){return Math.floor(Date.now()/86400000);}
function srState(){return store.get("vocabSR",{});}
function dueWords(){
  const st=srState();
  const due=VOCAB.filter(v=>{const e=st[v.w];return !e||(today()-e.last)>=SR_INTERVALS[Math.min(e.box,5)];});
  return shuffle(due);
}
function dailyWords(limit=10){
  const st=srState();
  const due=dueWords();
  const reviews=due.filter(v=>st[v.w]);
  const fresh=due.filter(v=>!st[v.w]);
  return shuffle(reviews).concat(shuffle(fresh)).slice(0,limit);
}
function srUpdate(word,correct){
  const st=srState();
  const e=st[word]||{box:0,last:0,seen:0,right:0};
  e.box=correct?Math.min(e.box+1,5):Math.max(e.box-1,0);
  e.last=today(); e.seen++; if(correct)e.right++;
  st[word]=e; store.set("vocabSR",st);
}
function fillOpts(correct,pool,extra){
  /* build 4 unique options containing `correct`; `extra` items are preferred distractors */
  const opts=[correct];
  (extra||[]).concat(shuffle(pool)).forEach(c=>{if(opts.length<4&&c&&!opts.includes(c))opts.push(c);});
  return shuffle(opts);
}
function vocabQuestion(v){
  const mode=pick(["syn","ant","def"]);
  const others=shuffle(VOCAB.filter(x=>x.w!==v.w));
  const pool=others.flatMap(o=>[o.s[0],o.a[0]]);
  if(mode==="syn"){
    const opts=fillOpts(v.s[0],pool.filter(x=>x!==v.a[0]&&x!==v.a[1]),[]);
    return {q:`Which word is closest in meaning to "${v.w.toUpperCase()}"?`,texts:opts,answerIdx:opts.indexOf(v.s[0]),expl:`"${v.w}" means ${v.d} - closest is "${v.s[0]}". (Opposite: ${v.a[0]}.)`,topic:"synonyms"};
  }
  if(mode==="ant"){
    const opts=fillOpts(v.a[0],pool.filter(x=>x!==v.s[0]&&x!==v.s[1]),[v.s[0]]);
    return {q:`Which word is most OPPOSITE in meaning to "${v.w.toUpperCase()}"?`,texts:opts,answerIdx:opts.indexOf(v.a[0]),expl:`"${v.w}" means ${v.d}, so the opposite is "${v.a[0]}". Careful: "${v.s[0]}" is a synonym - the classic trap.`,topic:"antonyms"};
  }
  const opts=fillOpts(v.w,others.map(o=>o.w),[]);
  return {q:`Which word means: "${v.d}"?`,texts:opts,answerIdx:opts.indexOf(v.w),expl:`"${v.w}" = ${v.d}. Synonyms: ${v.s.join(", ")}.`,topic:"definitions"};
}

function weakTopics(subject){
  return new Set(Object.entries(store.get("stats",{})).filter(([key,v])=>{
    const [sub,topic]=key.split("|");
    return sub===subject&&v.t>=4&&v.c/v.t<0.7&&topic;
  }).map(([key])=>key.split("|")[1]));
}
function pickPracticeQuestion(gens,subject){
  const weak=weakTopics(subject);
  if(!weak.size||Math.random()<0.3)return pick(gens)();
  const candidates=Array.from({length:12},()=>pick(gens)());
  return candidates.find(q=>weak.has(q.topic))||candidates[0];
}
/* ---- generic practice session runner ---- */
function runSession(opts){
  /* opts: {title, subject, nextQuestion():q, total, onWordResult?} - q:{prompt/q, cells?, grid?, opts(shapes) or texts, answerIdx, expl, topic} */
  let idx=0, score=0;
  function renderQ(){
    const q=opts.nextQuestion();
    if(!q){finish();return;}
    let inner=`<div class="topbar"><h2>${opts.title}</h2><span class="pill">Question ${idx+1} of ${opts.total}</span></div>`;
    inner+=`<p class="qtext">${q.prompt||q.q}</p>`;
    if(q.grid){
      inner+=`<div class="grid3">${q.grid.map(s=>`<div class="cell">${shapeRender(s)}</div>`).join("")}<div class="cell q">?</div></div>`;
    }else if(q.cells){
      inner+=`<div class="qcells">${q.cells.map(s=>`<div class="cell">${shapeRender(s)}</div>`).join("")}${q.type==="series"?'<div class="cell q">?</div>':""}</div>`;
    }
    inner+=`<div class="opts">`+
      (q.texts
        ? q.texts.map((t,i)=>`<button class="opt text" data-i="${i}"><span class="lab">${LETTERS[i]}</span>${t}</button>`).join("")
        : q.opts.map((s,i)=>`<button class="opt" data-i="${i}"><span class="lab">${LETTERS[i]}</span>${shapeRender(s)}</button>`).join(""))
      +`</div><div id="fb"></div>`;
    main.innerHTML=`<div class="card">${inner}</div>`;
    main.querySelectorAll(".opt").forEach(btn=>{
      btn.onclick=()=>{
        const i=+btn.dataset.i, correct=i===q.answerIdx;
        if(correct)score++;
        recordStat(opts.subject,q.topic,correct);
        if(opts.onResult)opts.onResult(q,correct);
        main.querySelectorAll(".opt").forEach((b,bi)=>{
          b.disabled=true;
          if(bi===q.answerIdx)b.classList.add("correct");
          else if(bi===i)b.classList.add("wrong");
        });
        document.getElementById("fb").innerHTML=`<div class="feedback ${correct?"good":"bad"}"><b>${correct?"✔ Correct!":"✘ Not quite - the answer is "+LETTERS[q.answerIdx]+"."}</b><br>${q.expl}</div><button class="btn" id="nextB">${idx+1>=opts.total?"See results":"Next question →"}</button>`;
        document.getElementById("nextB").onclick=()=>{idx++;idx>=opts.total?finish():renderQ();};
      };
    });
  }
  function finish(){
    const pct=Math.round(100*score/Math.max(idx,1));
    main.innerHTML=`<div class="card" style="text-align:center">
      <h2>Session complete 🎉</h2>
      <p style="font-size:2.2rem;font-weight:800;color:var(--brand)">${score} / ${idx}</p>
      <p>${pct>=80?"Brilliant work - that's a super score!":pct>=60?"Good effort - nearly there, keep practising!":"Great practising - every question you review makes you stronger!"}</p>
      <button class="btn" onclick="setTab('${opts.retabId||"home"}')">Practise again</button>
      <button class="btn ghost" onclick="setTab('progress')">See progress</button>
    </div>`;
    const hist=store.get("sessions",[]);
    hist.push({d:Date.now(),mode:opts.title,score,total:idx});
    store.set("sessions",hist.slice(-200));
  }
  renderQ();
}

function buildMockPapers(){
  const passage=pick(PASSAGES);
  const p1=[];
  passage.qs.forEach(pq=>p1.push({subject:"english",topic:"comprehension",passage,q:pq.q,texts:pq.o,answerIdx:pq.a,expl:pq.e}));
  shuffle(VOCAB).slice(0,7).forEach(v=>p1.push({subject:"english",...vocabQuestion(v)}));
  for(let i=0;i<8;i++)p1.push({subject:"verbal",...pick(VR_GENS)()});
  while(p1.length<20)p1.push({subject:"english",...vocabQuestion(pick(VOCAB))});
  const p2=[];
  for(let i=0;i<12;i++)p2.push({subject:"maths",...pick(MATH_GENS)()});
  for(let i=0;i<8;i++)p2.push({subject:"nonverbal",...pick(NVR_GENS)()});
  return [{name:"Paper 1 - English & Verbal Reasoning",mins:25,qs:p1},{name:"Paper 2 - Maths & Non-Verbal Reasoning",mins:25,qs:p2}];
}
function startMock(profileKey="practice"){
  const profile=EXAM_PROFILES[profileKey]||EXAM_PROFILES.practice;
  const papers=buildMockPapers();
  let paperIdx=0;
  const answers=[papers[0].qs.map(()=>null),papers[1].qs.map(()=>null)];
  function runPaper(){
    const paper=papers[paperIdx];
    let qi=0, remaining=paper.mins*60;
    if(mockTimerHandle)clearInterval(mockTimerHandle);
    mockTimerHandle=setInterval(()=>{
      remaining--;
      const t=document.getElementById("mockTimer");
      if(t){t.textContent=fmtT(remaining);t.classList.toggle("low",remaining<120);}
      if(remaining<=0){clearInterval(mockTimerHandle);mockTimerHandle=null;endPaper();}
    },1000);
    const fmtT=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    function renderQ(){
      const q=paper.qs[qi];
      let inner=`<div class="topbar"><h2>${paper.name}</h2><span class="timer" id="mockTimer">${fmtT(remaining)}</span></div>
      <div class="mocknav">${paper.qs.map((_,i)=>`<button class="${answers[paperIdx][i]!==null?"done":""} ${i===qi?"cur":""}" data-n="${i}">${i+1}</button>`).join("")}</div>`;
      if(q.passage)inner+=`<div class="passage"><b>${q.passage.title}</b><br>${q.passage.text}</div>`;
      inner+=`<p class="qtext"><b>Q${qi+1}.</b> ${q.prompt||q.q}</p>`;
      if(q.grid)inner+=`<div class="grid3">${q.grid.map(s=>`<div class="cell">${shapeRender(s)}</div>`).join("")}<div class="cell q">?</div></div>`;
      else if(q.cells)inner+=`<div class="qcells">${q.cells.map(s=>`<div class="cell">${shapeRender(s)}</div>`).join("")}${q.type==="series"?'<div class="cell q">?</div>':""}</div>`;
      inner+=`<div class="opts">`+
        (q.texts
          ?q.texts.map((t,i)=>`<button class="opt text ${answers[paperIdx][qi]===i?"correct":""}" data-i="${i}"><span class="lab">${LETTERS[i]}</span>${t}</button>`).join("")
          :q.opts.map((s,i)=>`<button class="opt ${answers[paperIdx][qi]===i?"correct":""}" data-i="${i}"><span class="lab">${LETTERS[i]}</span>${shapeRender(s)}</button>`).join(""))
        +`</div>
      <p style="margin-top:14px;text-align:center">
        <button class="btn ghost" id="prevB" ${qi===0?"disabled":""}>← Back</button>
        <button class="btn" id="nextB">${qi===paper.qs.length-1?"Finish paper":"Next →"}</button>
      </p>`;
      main.innerHTML=`<div class="card">${inner}</div>`;
      main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers[paperIdx][qi]=+b.dataset.i;renderQ();});
      main.querySelectorAll(".mocknav button").forEach(b=>b.onclick=()=>{qi=+b.dataset.n;renderQ();});
      document.getElementById("prevB").onclick=()=>{if(qi>0){qi--;renderQ();}};
      document.getElementById("nextB").onclick=()=>{
        if(qi<paper.qs.length-1){qi++;renderQ();}
        else{
          const blanks=answers[paperIdx].filter(a=>a===null).length;
          if(blanks===0||confirm(`You have ${blanks} unanswered question${blanks>1?"s":""}. In the real exam, never leave blanks! Finish anyway?`)){clearInterval(mockTimerHandle);mockTimerHandle=null;endPaper();}
        }
      };
    }
    function endPaper(){
      if(paperIdx===0){
        paperIdx=1;
        main.innerHTML=`<div class="card" style="text-align:center"><h2>Paper 1 complete ✔</h2><p>Take a two-minute stretch, then start Paper 2 when ready.</p><button class="btn" id="p2B">Start Paper 2</button></div>`;
        document.getElementById("p2B").onclick=runPaper;
      }else mockReport();
    }
    renderQ();
  }
  function mockReport(){
    const bySub={english:{c:0,t:0},verbal:{c:0,t:0},maths:{c:0,t:0},nonverbal:{c:0,t:0}};
    const topicMiss={};
    papers.forEach((p,pi)=>p.qs.forEach((q,i)=>{
      const correct=answers[pi][i]===q.answerIdx;
      bySub[q.subject].t++; if(correct)bySub[q.subject].c++;
      recordStat(q.subject,q.topic,correct);
      if(!correct)topicMiss[q.topic]=(topicMiss[q.topic]||0)+1;
    }));
    const pc=s=>s.t?s.c/s.t:0;
    const finalScore=Math.round(100*(profile.weights.english*pc(bySub.english)+profile.weights.verbal*pc(bySub.verbal)+profile.weights.maths*pc(bySub.maths)+profile.weights.nonverbal*pc(bySub.nonverbal)));
    const worst=Object.entries(topicMiss).sort((a,b)=>b[1]-a[1]).slice(0,4);
    main.innerHTML=`<div class="card"><h2>📋 Mock Exam Report</h2>
    <p style="font-size:2rem;font-weight:800;color:var(--brand);text-align:center">${finalScore}%</p>
    <p style="text-align:center" class="small">${profile.label}: ${profile.note}</p>
    <table class="report" style="width:100%"><tr><th>Section</th><th>Score</th><th>Weight</th><th></th></tr>
    ${["english","verbal","maths","nonverbal"].map(key=>`<tr><td>${key==="nonverbal"?"Non-Verbal Reasoning":key[0].toUpperCase()+key.slice(1)}</td><td>${bySub[key].c}/${bySub[key].t}</td><td>${Math.round(profile.weights[key]*100)}%</td><td><div class="bar"><i style="width:${Math.round(pc(bySub[key])*100)}%"></i></div></td></tr>`).join("")}</table>
    ${worst.length?`<h3>Topics to review</h3><p>${worst.map(([t,n])=>`<span class="pill">${t} (${n} missed)</span>`).join(" ")}</p>`:"<p>🌟 Nothing missed twice - outstanding!</p>"}
    <p style="text-align:center;margin-top:12px"><button class="btn" onclick="setTab('mock')">Another mock</button> <button class="btn ghost" onclick="setTab('progress')">Full progress</button></p></div>`;
    const hist=store.get("sessions",[]);
    hist.push({d:Date.now(),mode:"Mock exam",score:finalScore,total:100});
    store.set("sessions",hist.slice(-200));
  }
  runPaper();
}
window.setTab=setTab;
setTab("home");
</script>
</body>
</html>
